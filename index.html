<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal Login — The Governor Creek School</title>
<link rel="icon" href="../images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="brand-row">
      <img src="../images/logo.jpg" alt="The Governor Creek School logo" class="brand-logo">
      <span>The Governor Creek School</span>
    </div>
    <h1>Staff Portal</h1>
    <p class="subtitle">Restricted to administrative and teaching staff.</p>
    <p class="login-error"></p>
    <form id="login-form" onsubmit="return handleLogin(event)" novalidate>
      <div class="form-field">
        <label for="login-email">Email <span class="required-mark">*</span></label>
        <input type="email" id="login-email" name="login-email" required maxlength="120" placeholder="firstname.lastname@governorcreekschool.ac.ke">
      </div>
      <div class="form-field">
        <label for="login-password">Password <span class="required-mark">*</span></label>
        <input type="password" id="login-password" name="login-password" required minlength="4" maxlength="60" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
    </form>
    <p class="demo-note">Demo mode is active: sign in with any email/password to explore the interface. Configure <code>js/supabase-client.js</code> to enable real staff accounts.</p>
    <p style="margin-top:16px;"><a href="../index.html" style="font-size:0.85rem; color:var(--tide);">← Back to the public site</a></p>
  </div>
</div>
<script src="../js/supabase-client.js"></script>
<script src="../js/data-service.js"></script>
<script src="../js/validation.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
